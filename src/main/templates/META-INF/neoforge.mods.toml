# Use Kotlin for (NeoForge)
modLoader = "kotlinforforge"
loaderVersion = "${loader_version_range}"

license = "${mod_license}"

issueTrackerURL = "https://github.com/sinsinewave/ThereWereANumberOfSigns/issues"

[[mods]]
modId       = "${mod_id}"
version     = "${mod_version}"
displayName = "${mod_name}"
displayURL  = "https://github.com/sinsinewave/ThereWereANumberOfSigns"
# TODO: Logo/icon
#logoFile="signsmod.png"
#credits=""
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

# NeoForge dependency
[[dependencies."${mod_id}"]]
modId        = "neoforge"
type         = "required"
versionRange = "${neo_version_range}"
ordering     = "NONE"
side         = "BOTH"

# Minecraft dependency
[[dependencies."${mod_id}"]]
modId        = "minecraft"
type         = "required"
versionRange = "${minecraft_version_range}"
ordering     = "NONE"
side         = "BOTH"

# Kotlin dependency
[[dependencies."${mod_id}"]]
modId        = "kotlinforforge"
type         = "required"
versionRange = "[5.4,)"
ordering     = "NONE"
side         = "BOTH"